<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sub2API - AI API Gateway</title>
    <script nonce="__CSP_NONCE_VALUE__">
      // Apply appearance before styles paint; the backend substitutes the CSP nonce.
      try {
        document.documentElement.dataset.skin = localStorage.getItem('sub2api-skin') === 'classic' ? 'classic' : 'modern'
        const theme = localStorage.getItem('theme')
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches))
      } catch {
        document.documentElement.dataset.skin = 'modern'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
